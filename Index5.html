<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#f5f7f5">
<title>Дневник питания</title>
<style>
:root {
  --bg: #f5f7f5; /* Светлый фон, как на скрине */
  --card: #ffffff;
  --text: #111827; /* Темно-серый текст */
  --text-muted: #6b7280;
  --accent: #12a65b; /* Фирменный зеленый */
  --accent-light: #e6f6ec;
  --border: #f1f3f2;
  --protein: #ef4444;
  --fat: #f59e0b;
  --carb: #3b82f6;
  --radius: 20px;
  --radius-sm: 12px;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body {
  margin: 0; padding: 0;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  background: var(--bg); color: var(--text);
  padding-bottom: 90px; font-size: 15px; line-height: 1.4;
  -webkit-font-smoothing: antialiased;
}
.app { max-width: 500px; margin: 0 auto; padding: 20px 16px; }

/* --- Шапка --- */
.header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 20px; }
.header-title h1 { font-size: 24px; font-weight: 800; margin: 0 0 4px; letter-spacing: -0.5px; }
.header-title p { margin: 0; font-size: 13px; color: var(--text-muted); line-height: 1.3; }
.header-right { display: flex; align-items: center; gap: 12px; }
.avatar { width: 50px; height: 50px; border-radius: 50%; background: #d1fae5; display: flex; align-items: center; justify-content: center; font-size: 24px; }
.settings-btn { background: none; border: none; font-size: 22px; color: var(--text); cursor: pointer; padding: 0; }

/* --- Карточка калорий и макросов --- */
.summary-card { display: flex; align-items: center; gap: 16px; padding: 20px; margin-bottom: 20px; }
.circle-wrap { position: relative; width: 100px; height: 100px; flex-shrink: 0; border-radius: 50%; display: flex; align-items: center; justify-content: center; background: conic-gradient(var(--accent) 0%, var(--accent) var(--pct), var(--border) var(--pct), var(--border) 100%); }
.circle-inner { width: 86px; height: 86px; background: var(--card); border-radius: 50%; display: flex; flex-direction: column; align-items: center; justify-content: center; }
.circle-val { font-size: 20px; font-weight: 800; line-height: 1.1; }
.circle-sub { font-size: 10px; color: var(--text-muted); margin-top: 2px; }
.macros-grid { flex-grow: 1; display: flex; justify-content: space-between; gap: 8px; }
.macro-col { display: flex; flex-direction: column; align-items: center; text-align: center; flex: 1; }
.macro-icon { font-size: 18px; margin-bottom: 4px; }
.macro-name { font-size: 11px; color: var(--text-muted); margin-bottom: 2px; }
.macro-val { font-size: 14px; font-weight: 700; margin-bottom: 4px; }
.macro-bar { width: 100%; height: 4px; background: var(--border); border-radius: 2px; overflow: hidden; }
.macro-bar i { display: block; height: 100%; border-radius: 2px; }

/* --- Навигация по датам --- */
.datenav { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; padding: 0 4px; }
.datenav button { width: 36px; height: 36px; border-radius: 50%; background: var(--card); border: none; box-shadow: 0 2px 8px rgba(0,0,0,0.04); font-size: 16px; cursor: pointer; display: flex; align-items: center; justify-content: center; color: var(--text); }
.datenav .label { display: flex; align-items: center; gap: 6px; font-weight: 600; font-size: 15px; }

/* --- Заголовок приемов пищи --- */
.section-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; padding: 0 4px; }
.section-head h2 { font-size: 18px; font-weight: 800; margin: 0; }
.btn-add-main { display: flex; align-items: center; gap: 6px; background: transparent; border: 1px solid var(--accent); color: var(--accent); font-weight: 600; padding: 8px 14px; border-radius: 99px; font-size: 13px; cursor: pointer; }

/* --- Карточка приема пищи --- */
.meal-card { display: flex; flex-direction: column; padding: 0; margin-bottom: 12px; position: relative; cursor: pointer; }
.meal-head-click { display: flex; align-items: center; padding: 14px 16px; }
.meal-img { width: 54px; height: 54px; border-radius: 14px; display: flex; align-items: center; justify-content: center; font-size: 26px; margin-right: 16px; flex-shrink: 0; background: var(--bg); }
.meal-info { flex-grow: 1; }
.meal-title { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 15px; margin-bottom: 4px; }
.meal-time { font-size: 12px; color: var(--text-muted); font-weight: 400; }
.meal-kcal { font-size: 14px; font-weight: 700; color: var(--accent); margin-bottom: 4px; }
.meal-macros { font-size: 11px; color: var(--text-muted); display: flex; gap: 8px; }
.meal-chevron { color: #d1d5db; font-size: 20px; margin-left: 10px; font-weight: 300; transition: transform 0.2s; }
.meal-card.expanded .meal-chevron { transform: rotate(90deg); }
.add-btn { width: 36px; height: 36px; border-radius: 50%; border: none; background: var(--accent-light); color: var(--accent); font-size: 20px; display: flex; align-items: center; justify-content: center; cursor: pointer; margin-left: 10px; flex-shrink: 0; }
.meal-items-list { padding: 0 16px 14px 86px; font-size: 13px; color: var(--text-muted); display: none; }
.meal-card.expanded .meal-items-list { display: block; }
.meal-item-row { display: flex; justify-content: space-between; padding: 6px 0; border-top: 1px solid var(--border); }
.del-item { color: var(--protein); background: none; border: none; cursor: pointer; padding: 0 4px; font-size: 14px; }

/* --- Мини-виджеты --- */
.bottom-widgets { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 20px; }
.widget-card { background: var(--card); border-radius: var(--radius); padding: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.02); cursor: pointer; }
.widget-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; font-weight: 700; font-size: 13px; }
.widget-head .chevron { color: #d1d5db; }
.mini-chart { display: flex; align-items: flex-end; justify-content: space-between; height: 40px; gap: 4px; }
.mini-chart .col { flex: 1; background: var(--border); border-radius: 4px; transition: height 0.3s; }
.mini-chart .col.active { background: var(--accent); }
.weight-val { font-size: 24px; font-weight: 800; margin-bottom: 2px; }
.weight-diff { font-size: 12px; color: var(--text-muted); margin-bottom: 10px; }
.mini-weight-svg { width: 100%; height: 40px; display: block; }
.badge-success { background: var(--accent-light); color: var(--accent); font-size: 10px; font-weight: 700; padding: 4px 8px; border-radius: 99px; display: inline-flex; align-items: center; gap: 4px; margin-top: 8px; }

/* --- Баннер цели --- */
.goal-banner { background: var(--accent-light); border-radius: var(--radius); padding: 16px; margin-top: 12px; display: flex; align-items: center; gap: 12px; }
.goal-icon { font-size: 24px; }
.goal-info { flex-grow: 1; }
.goal-title { font-size: 12px; color: var(--text-muted); margin-bottom: 2px; }
.goal-text { font-size: 15px; font-weight: 700; margin-bottom: 8px; }
.goal-bar { height: 6px; background: rgba(18,166,91,0.2); border-radius: 3px; overflow: hidden; }
.goal-bar i { display: block; height: 100%; background: var(--accent); border-radius: 3px; }
.goal-vals { font-size: 12px; font-weight: 700; text-align: right; }

/* --- Базовая карточка --- */
.card { background: var(--card); border-radius: var(--radius); padding: 20px; box-shadow: 0 4px 20px rgba(0,0,0,0.03); margin-bottom: 16px; }
.card h3 { font-size: 16px; font-weight: 800; margin: 0 0 16px; }

/* --- Таббар --- */
.tabbar { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 500px; display: flex; background: var(--card); border-top: 1px solid var(--border); z-index: 50; padding: 8px 0 calc(8px + env(safe-area-inset-bottom)); border-radius: 24px 24px 0 0; box-shadow: 0 -4px 24px rgba(0,0,0,0.04); }
.tabbar button { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; background: none; border: 0; padding: 6px 0; font-size: 10px; font-weight: 600; color: var(--text-muted); cursor: pointer; }
.tabbar .ico { font-size: 20px; line-height: 1; margin-bottom: 2px; }
.tabbar button.active { color: var(--accent); }
.tabbar button.active .ico { transform: translateY(-2px); transition: 0.2s; }

/* --- Формы и кнопки --- */
.btn { display: flex; align-items: center; justify-content: center; gap: 8px; padding: 14px 20px; border-radius: 14px; border: none; background: var(--accent); color: #fff; font-size: 15px; font-weight: 700; cursor: pointer; width: 100%; margin-bottom: 10px; }
.btn.ghost { background: var(--bg); color: var(--text); }
.btn.danger { background: transparent; border: 1px solid var(--protein); color: var(--protein); }
.input { width: 100%; padding: 12px 14px; border-radius: 12px; border: 1px solid var(--border); background: var(--bg); color: var(--text); font-size: 15px; outline: none; margin-bottom: 12px; }
.input:focus { border-color: var(--accent); }
.field label { display: block; font-size: 12px; color: var(--text-muted); font-weight: 600; margin-bottom: 6px; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

/* --- Модальное окно --- */
.sheet-wrap { position: fixed; inset: 0; background: rgba(0,0,0,0.4); display: none; z-index: 100; align-items: flex-end; justify-content: center; backdrop-filter: blur(2px); }
.sheet-wrap.open { display: flex; animation: fade 0.2s; }
.sheet { background: var(--card); width: 100%; max-width: 500px; border-radius: 24px 24px 0 0; max-height: 85vh; overflow-y: auto; padding: 20px 20px calc(20px + env(safe-area-inset-bottom)); animation: slideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1); }
@keyframes fade { from { opacity: 0; } }
@keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
.sheet-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; font-size: 18px; font-weight: 800; }
.sheet-head .x { background: var(--bg); border: none; width: 32px; height: 32px; border-radius: 50%; font-size: 16px; color: var(--text-muted); cursor: pointer; }
.food-list { max-height: 45vh; overflow-y: auto; margin-bottom: 16px; }
.food-row { width: 100%; display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--border); background: none; border-left: none; border-right: none; border-top: none; color: var(--text); text-align: left; cursor: pointer; font-size: 15px; }
.food-row .kcal { font-weight: 800; color: var(--accent); }
.preview { text-align: center; background: var(--bg); border-radius: 16px; padding: 20px; margin-bottom: 20px; }
.prev-kcal { font-size: 32px; font-weight: 800; color: var(--accent); }
.tab { display: none; }
.tab.active { display: block; animation: fade 0.2s; }
</style>
</head>
<body>

<div class="app">
  <main>
    <section class="tab active" id="tab-diary"></section>
    <section class="tab" id="tab-stats"></section>
    <section class="tab" id="tab-weight"></section>
    <section class="tab" id="tab-settings"></section>
  </main>
</div>

<nav class="tabbar">
  <button data-act="tab" data-tab="diary" class="active"><span class="ico">🏠</span>Главная</button>
  <button data-act="tab" data-tab="stats"><span class="ico">📊</span>Статистика</button>
  <button data-act="tab" data-tab="weight"><span class="ico">⚖️</span>Вес</button>
  <button data-act="tab" data-tab="settings"><span class="ico">👤</span>Профиль</button>
</nav>

<div class="sheet-wrap" id="sheetWrap"><div class="sheet" id="sheetBody"></div></div>

<script>
const FOODS = [
  {n:'Овсяные хлопья (сухие)', k:352, p:12.3, f:6.1, c:59.5}, {n:'Гречка (сухая)', k:343, p:12.6, f:3.3, c:62},
  {n:'Рис белый (сухой)', k:344, p:6.7, f:0.7, c:78.9}, {n:'Рис бурый (сухой)', k:337, p:7.4, f:1.8, c:72.9},
  {n:'Макароны (сухие)', k:350, p:12, f:1.5, c:70}, {n:'Хлеб цельнозерновой', k:247, p:13, f:4.2, c:41},
  {n:'Картофель', k:77, p:2, f:0.4, c:17}, {n:'Батат', k:86, p:1.6, f:0.1, c:20},
  {n:'Куриная грудка', k:165, p:31, f:3.6, c:0}, {n:'Индейка, филе', k:104, p:19.2, f:2, c:0},
  {n:'Говядина', k:250, p:26, f:16, c:0}, {n:'Свинина нежирная', k:263, p:27, f:16, c:0},
  {n:'Лосось', k:208, p:20, f:13, c:0}, {n:'Тунец', k:130, p:23, f:4.9, c:0}, {n:'Треска', k:82, p:18, f:0.7, c:0},
  {n:'Яйцо куриное', k:157, p:12.7, f:11.5, c:0.7}, {n:'Творог 5%', k:121, p:17, f:5, c:3},
  {n:'Творог 0%', k:71, p:16.5, f:0.2, c:1.5}, {n:'Греческий йогурт 2%', k:59, p:10, f:0.4, c:3.6},
  {n:'Кефир 1%', k:40, p:2.8, f:1, c:4}, {n:'Молоко 2.5%', k:52, p:2.8, f:2.5, c:4.7},
  {n:'Сыр твёрдый', k:400, p:25, f:33, c:0}, {n:'Банан', k:96, p:1.5, f:0.2, c:21},
  {n:'Яблоко', k:52, p:0.4, f:0.2, c:14}, {n:'Апельсин', k:47, p:0.9, f:0.1, c:12},
  {n:'Виноград', k:69, p:0.7, f:0.2, c:17}, {n:'Авокадо', k:160, p:2, f:15, c:9},
  {n:'Миндаль', k:579, p:21, f:50, c:22}, {n:'Грецкий орех', k:654, p:15, f:65, c:14},
  {n:'Ореховая паста', k:588, p:25, f:50, c:20}, {n:'Оливковое масло', k:884, p:0, f:100, c:0},
  {n:'Масло сливочное', k:717, p:0.9, f:81, c:0.1}, {n:'Чечевица (сухая)', k:352, p:24, f:1, c:60},
  {n:'Фасоль (сухая)', k:333, p:24, f:1.5, c:60}, {n:'Нут (сухой)', k:364, p:19, f:6, c:61},
  {n:'Изюм', k:299, p:3, f:0.5, c:79}, {n:'Мёд', k:304, p:0.3, f:0, c:82},
  {n:'Шоколад тёмный 70%', k:598, p:7.8, f:43, c:46}, {n:'Протеин (порошок)', k:380, p:75, f:5, c:8},
  {n:'Куриное бедро', k:185, p:20, f:11, c:0}
];

const MEALS = [
  {key:'breakfast', name:'Завтрак', icon:'🌅', img:'🥣', bg:'#fef3c7'},
  {key:'lunch',     name:'Обед',    icon:'☀️', img:'🍲', bg:'#dcfce7'},
  {key:'dinner',    name:'Ужин',    icon:'🌙', img:'🐟', bg:'#e0e7ff'},
  {key:'snack',     name:'Перекус', icon:'☁️', img:'🍎', bg:'#fee2e2'}
];

const STORE_KEY = 'massApp_v1';
const DEFAULT_GOALS = {kcal:2500, p:110, f:60, c:350};

let state = loadState();
let curDate = iso(new Date());
let tab = 'diary';
let sheet = null;

function loadState() {
  let s = null;
  try { s = JSON.parse(localStorage.getItem(STORE_KEY)); } catch(e){}
  if (!s) s = {};
  s.goals = Object.assign({}, DEFAULT_GOALS, s.goals || {});
  s.days = s.days || {};
  s.weights = s.weights || [];
  s.profile = Object.assign({sex:'m', age:29, height:155, weight:53, activity:1.375, surplus:250}, s.profile || {});
  return s;
}
function saveState(){ localStorage.setItem(STORE_KEY, JSON.stringify(state)); }

const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function iso(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function parseISO(s){ const a = s.split('-').map(Number); return new Date(a[0], a[1]-1, a[2]); }
function shiftDate(s, delta){ const d = parseISO(s); d.setDate(d.getDate()+delta); return iso(d); }
const MONTHS = ['янв','фев','мар','апр','мая','июн','июл','авг','сен','окт','ноя','дек'];
const WEEKDAYS = ['вс','пн','вт','ср','чт','пт','сб'];

function humanDate(s){
  const d = parseISO(s), today = iso(new Date());
  const base = d.getDate()+' '+MONTHS[d.getMonth()];
  if (s === today) return {main:'Сегодня, ' + base};
  if (s === shiftDate(today,-1)) return {main:'Вчера, ' + base};
  if (s === shiftDate(today,1)) return {main:'Завтра, ' + base};
  return {main: WEEKDAYS[d.getDay()]+', '+d.getDate()+' '+MONTHS[d.getMonth()]};
}
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }

function getDayItems(date, mealKey){
  const d = state.days[date];
  return (d && d.meals && d.meals[mealKey]) || [];
}
function dayTotals(date){
  const t = {kcal:0, p:0, f:0, c:0};
  MEALS.forEach(m => getDayItems(date, m.key).forEach(i => {
    t.kcal += i.kcal; t.p += i.p; t.f += i.f; t.c += i.c;
  }));
  return t;
}
function lastNDates(n){
  const out = [], t = iso(new Date());
  for (let i = n-1; i >= 0; i--) out.push(shiftDate(t, -i));
  return out;
}

function addItem(mealKey, item){
  if (!state.days[curDate]) state.days[curDate] = {meals:{}};
  if (!state.days[curDate].meals) state.days[curDate].meals = {};
  if (!state.days[curDate].meals[mealKey]) state.days[curDate].meals[mealKey] = [];
  state.days[curDate].meals[mealKey].push(item);
  saveState(); render();
}
function delItem(mealKey, id){
  if (!state.days[curDate] || !state.days[curDate].meals || !state.days[curDate].meals[mealKey]) return;
  const arr = state.days[curDate].meals[mealKey];
  const i = arr.findIndex(x => x.id === id);
  if (i > -1){ arr.splice(i,1); saveState(); render(); }
}
function addWeight(date, weight){
  state.weights = state.weights.filter(w => w.date !== date);
  state.weights.push({date, weight});
  state.weights.sort((a,b) => a.date < b.date ? -1 : 1);
  state.profile.weight = weight;
  saveState(); render();
}

/* ================= ДНЕВНИК ================= */
function diaryHTML(){
  const t = dayTotals(curDate), g = state.goals;
  const pct = Math.min(100, (t.kcal / g.kcal) * 100);
  const hd = humanDate(curDate);
  
  const last7 = lastNDates(7).map(d => dayTotals(d).kcal);
  const maxKcal = Math.max(...last7, g.kcal, 1);
  
  const ws = state.weights.slice(-7);
  let weightSvg = `<text x="50%" y="50%" dominant-baseline="middle" text-anchor="middle" font-size="10" fill="var(--text-muted)">Нет данных</text>`;
  if(ws.length >= 2) {
    const W = 140, H = 40, P = 5;
    const min = Math.min(...ws.map(x=>x.weight)) - 0.5, max = Math.max(...ws.map(x=>x.weight)) + 0.5;
    const pts = ws.map((x,i) => {
      const px = P + (i/(ws.length-1))*(W-2*P);
      const py = H - P - ((x.weight-min)/(max-min||1))*(H-2*P);
      return {x:px, y:py};
    });
    weightSvg = `<svg viewBox="0 0 ${W} ${H}" class="mini-weight-svg">
      <polyline points="${pts.map(p=>p.x.toFixed(1)+','+p.y.toFixed(1)).join(' ')}" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linecap="round"/>
      ${pts.map(p=>`<circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="2" fill="var(--card)" stroke="var(--accent)" stroke-width="1.5"/>`).join('')}
    </svg>`;
  }

  const currentWeight = ws.length ? ws[ws.length-1].weight : state.profile.weight;
  const startWeight = state.profile.weight;
  const targetWeight = startWeight + 5;
  const wDiff = (currentWeight - startWeight).toFixed(1);

  return `
  <div class="header">
    <div class="header-title">
      <h1>Дневник питания</h1>
      <p>Стройное тело начинается<br>с правильных решений 💪</p>
    </div>
    <div class="header-right">
      <div class="avatar">👨</div>
      <button class="settings-btn" data-act="tab" data-tab="settings">⚙️</button>
    </div>
  </div>

  <div class="card summary-card">
    <div class="circle-wrap" style="--pct:${pct}%">
      <div class="circle-inner">
        <div class="circle-val">${Math.round(t.kcal)}</div>
        <div class="circle-sub">из ${g.kcal} ккал</div>
      </div>
    </div>
    <div class="macros-grid">
      <div class="macro-col">
        <div class="macro-icon">🥩</div>
        <div class="macro-name">Белки</div>
        <div class="macro-val">${Math.round(t.p)} <span style="font-size:10px;color:var(--text-muted);font-weight:400">/ ${g.p}г</span></div>
        <div class="macro-bar"><i style="width:${Math.min(100,(t.p/g.p)*100)}%;background:var(--protein)"></i></div>
      </div>
      <div class="macro-col">
        <div class="macro-icon">🌾</div>
        <div class="macro-name">Углеводы</div>
        <div class="macro-val">${Math.round(t.c)} <span style="font-size:10px;color:var(--text-muted);font-weight:400">/ ${g.c}г</span></div>
        <div class="macro-bar"><i style="width:${Math.min(100,(t.c/g.c)*100)}%;background:var(--carb)"></i></div>
      </div>
      <div class="macro-col">
        <div class="macro-icon">💧</div>
        <div class="macro-name">Жиры</div>
        <div class="macro-val">${Math.round(t.f)} <span style="font-size:10px;color:var(--text-muted);font-weight:400">/ ${g.f}г</span></div>
        <div class="macro-bar"><i style="width:${Math.min(100,(t.f/g.f)*100)}%;background:var(--fat)"></i></div>
      </div>
    </div>
  </div>

  <div class="datenav">
    <button data-act="prevDay">‹</button>
    <div class="label"><span>📅</span> ${hd.main}</div>
    <button data-act="nextDay">›</button>
  </div>

  <div class="section-head">
    <h2>Приёмы пищи</h2>
    <button class="btn-add-main" data-act="openAdd" data-meal="snack">+ Добавить</button>
  </div>

  ${MEALS.map(m => {
    const items = getDayItems(curDate, m.key);
    const sum = items.reduce((a,i) => a + i.kcal, 0);
    const p = items.reduce((a,i) => a + i.p, 0);
    const f = items.reduce((a,i) => a + i.f, 0);
    const c = items.reduce((a,i) => a + i.c, 0);
    
    return `
    <div class="card meal-card">
      <div class="meal-head-click" data-act="toggleMeal">
        <div class="meal-img" style="background:${m.bg}">${m.img}</div>
        <div class="meal-info">
          <div class="meal-title">${m.name} <span class="meal-time">${m.key==='breakfast'?'08:00':m.key==='lunch'?'13:00':m.key==='dinner'?'19:00':'16:00'} ${m.icon}</span></div>
          <div class="meal-kcal" style="${items.length ? '' : 'color:var(--text-muted)'}">${items.length ? Math.round(sum) + ' ккал' : 'Нет записей'}</div>
          <div class="meal-macros" style="${items.length ? '' : 'display:none'}">Б: ${Math.round(p)} г &nbsp; Ж: ${Math.round(f)} г &nbsp; У: ${Math.round(c)} г</div>
        </div>
        ${items.length ? `<div class="meal-chevron">›</div>` : `<button class="add-btn" data-act="openAdd" data-meal="${m.key}">+</button>`}
      </div>
      <div class="meal-items-list">
        ${items.map(i => `
          <div class="meal-item-row">
            <span>${esc(i.name)} ${i.grams ? '('+i.grams+'г)' : ''}</span>
            <span>${Math.round(i.kcal)} ккал <button class="del-item" data-act="del" data-meal="${m.key}" data-id="${i.id}">✕</button></span>
          </div>
        `).join('')}
        <button class="btn-add-main" style="margin-top:12px; width:100%; justify-content:center;" data-act="openAdd" data-meal="${m.key}">+ Добавить продукт</button>
      </div>
    </div>`;
  }).join('')}

  <div class="bottom-widgets">
    <div class="widget-card" data-act="tab" data-tab="stats">
      <div class="widget-head"><span>📊 Статистика</span> <span class="chevron">›</span></div>
      <div class="mini-chart">
        ${last7.map((v,i) => `<div class="col ${v >= g.kcal*0.9 ? 'active' : ''}" style="height:${Math.max(10, (v/maxKcal)*100)}%"></div>`).join('')}
      </div>
      <div style="display:flex; justify-content:space-between; font-size:9px; color:var(--text-muted); margin-top:4px;">
        ${lastNDates(7).map(d => `<span>${WEEKDAYS[parseISO(d).getDay()]}</span>`).join('')}
      </div>
    </div>
    
    <div class="widget-card" data-act="tab" data-tab="weight">
      <div class="widget-head"><span>⚖️ Журнал</span> <span class="chevron">›</span></div>
      <div class="weight-val">${currentWeight.toFixed(1)} кг</div>
      <div class="weight-diff" style="color:${wDiff >= 0 ? 'var(--accent)' : 'var(--protein)'}">${wDiff > 0 ? '+' : ''}${wDiff} кг</div>
      ${weightSvg}
      <div class="badge-success">✓ Отличный прогресс!</div>
    </div>
  </div>

  <div class="goal-banner">
    <div class="goal-icon">🎯</div>
    <div class="goal-info">
      <div class="goal-title">Ваша цель</div>
      <div class="goal-text">Набрать ${(targetWeight - startWeight).toFixed(0)} кг</div>
      <div class="goal-bar"><i style="width:${Math.min(100, Math.max(0, ((currentWeight - startWeight) / (targetWeight - startWeight)) * 100))}%"></i></div>
    </div>
    <div class="goal-vals">
      <div style="font-size:14px;">${currentWeight.toFixed(1)} кг</div>
      <div style="font-size:10px;color:var(--text-muted);font-weight:400">из ${targetWeight.toFixed(1)} кг</div>
    </div>
  </div>
  `;
}

/* ================= СТАТИСТИКА ================= */
function statsHTML(){
  const dates = lastNDates(7);
  const vals = dates.map(d => dayTotals(d));
  const g = state.goals;
  const maxV = Math.max(g.kcal, ...vals.map(v => v.kcal), 1);
  const active = vals.filter(v => v.kcal > 0);
  const avg = key => active.length ? Math.round(active.reduce((a,v) => a + v[key], 0) / active.length) : 0;

  return `
  <div class="header"><div class="header-title"><h1>Статистика</h1></div></div>
  <div class="card">
    <h3>Последние 7 дней</h3>
    <div style="display:flex; align-items:flex-end; gap:8px; height:160px; padding-top:10px;">
      ${dates.map((d,i) => {
        const v = vals[i];
        const h = Math.round((v.kcal / maxV) * 100);
        const hit = v.kcal >= g.kcal * 0.9;
        return `<div style="flex:1; display:flex; flex-direction:column; align-items:center; justify-content:flex-end; height:100%;">
          <div style="font-size:11px; font-weight:700; margin-bottom:6px;">${v.kcal ? Math.round(v.kcal) : ''}</div>
          <div style="width:100%; height:100%; display:flex; align-items:flex-end; background:var(--bg); border-radius:8px; overflow:hidden;">
            <i style="width:100%; height:${h}%; background:${hit?'var(--accent)':'#d1d5db'}; border-radius:8px; transition:height 0.4s;"></i>
          </div>
          <div style="font-size:11px; color:var(--text-muted); margin-top:8px;">${WEEKDAYS[parseISO(d).getDay()]}</div>
        </div>`;
      }).join('')}
    </div>
  </div>
  <div class="card">
    <h3>Средние значения</h3>
    <div class="grid2" style="text-align:center;">
      <div><div style="font-size:24px; font-weight:800; color:var(--accent)">${avg('kcal')}</div><div class="small muted">ккал</div></div>
      <div><div style="font-size:24px; font-weight:800; color:var(--protein)">${avg('p')}</div><div class="small muted">белки</div></div>
      <div><div style="font-size:24px; font-weight:800; color:var(--carb)">${avg('c')}</div><div class="small muted">углеводы</div></div>
      <div><div style="font-size:24px; font-weight:800; color:var(--fat)">${avg('f')}</div><div class="small muted">жиры</div></div>
    </div>
  </div>
  <div class="card">
    <button class="btn ghost" data-act="exportCSV">📥 Скачать CSV</button>
  </div>`;
}

/* ================= ВЕС ================= */
function weightHTML(){
  const ws = state.weights.slice().sort((a,b) => a.date < b.date ? -1 : 1);
  const last = ws[ws.length-1];
  const first = ws[0];
  const totalDiff = last && first && ws.length > 1 ? (last.weight - first.weight) : 0;
  
  return `
  <div class="header"><div class="header-title"><h1>Вес</h1></div></div>
  <div class="card" style="text-align:center;">
    <div style="font-size:40px; font-weight:800; line-height:1;">${last ? last.weight.toFixed(1) : '—'}<span style="font-size:20px; color:var(--text-muted);"> кг</span></div>
    ${ws.length > 1 ? `<div style="margin-top:8px; font-weight:700; color:${totalDiff >= 0 ? 'var(--accent)' : 'var(--protein)'}">${totalDiff > 0 ? '+' : ''}${totalDiff.toFixed(1)} кг за всё время</div>` : ''}
  </div>
  <div class="card">
    <h3>Добавить взвешивание</h3>
    <div class="grid2">
      <div class="field"><label>Дата</label><input type="date" id="wDate" class="input" value="${iso(new Date())}"></div>
      <div class="field"><label>Вес, кг</label><input type="number" step="0.1" id="wVal" class="input" placeholder="53.0"></div>
    </div>
    <button class="btn" data-act="addWeight">Сохранить</button>
  </div>
  ${ws.length ? `
  <div class="card">
    <h3>История</h3>
    ${ws.slice().reverse().slice(0,10).map(w => `
      <div style="display:flex; justify-content:space-between; align-items:center; padding:12px 0; border-bottom:1px solid var(--border);">
        <span>${parseISO(w.date).getDate()} ${MONTHS[parseISO(w.date).getMonth()]} ${parseISO(w.date).getFullYear()}</span>
        <b>${w.weight.toFixed(1)} кг</b>
        <button class="del-item" data-act="delWeight" data-date="${w.date}">✕</button>
      </div>`).join('')}
  </div>` : ''}`;
}

/* ================= НАСТРОЙКИ ================= */
function settingsHTML(){
  const p = state.profile, g = state.goals;
  const acts = [[1.2,'Сидячая (1.2)'],[1.375,'Лёгкая (1.375)'],[1.55,'Средняя (1.55)'],[1.725,'Высокая (1.725)']];

  return `
  <div class="header"><div class="header-title"><h1>Профиль</h1></div></div>
  <div class="card">
    <h3>Личные данные</h3>
    <div class="grid2">
      <div class="field"><label>Пол</label>
        <select id="pSex" class="input">
          <option value="m" ${p.sex==='m'?'selected':''}>Мужской</option>
          <option value="f" ${p.sex==='f'?'selected':''}>Женский</option>
        </select>
      </div>
      <div class="field"><label>Возраст</label><input id="pAge" class="input" type="number" value="${p.age}"></div>
      <div class="field"><label>Рост, см</label><input id="pHeight" class="input" type="number" value="${p.height}"></div>
      <div class="field"><label>Вес, кг</label><input id="pWeight" class="input" type="number" step="0.1" value="${p.weight}"></div>
    </div>
    <div class="field"><label>Активность</label>
      <select id="pActivity" class="input">
        ${acts.map(([v,n]) => `<option value="${v}" ${Math.abs(p.activity-v)<0.001?'selected':''}>${n}</option>`).join('')}
      </select>
    </div>
    <div class="field"><label>Профицит калорий, ккал</label><input id="pSurplus" class="input" type="number" value="${p.surplus}"></div>
    <button class="btn ghost" data-act="autoCalc">🧮 Рассчитать норму</button>
  </div>

  <div class="card">
    <h3>Цели на день</h3>
    <div class="grid2">
      <div class="field"><label>Калории</label><input id="gKcal" class="input" type="number" value="${g.kcal}"></div>
      <div class="field"><label>Белки, г</label><input id="gP" class="input" type="number" value="${g.p}"></div>
      <div class="field"><label>Жиры, г</label><input id="gF" class="input" type="number" value="${g.f}"></div>
      <div class="field"><label>Углеводы, г</label><input id="gC" class="input" type="number" value="${g.c}"></div>
    </div>
    <button class="btn" data-act="saveGoals">Сохранить цели</button>
  </div>

  <div class="card">
    <h3>Данные</h3>
    <button class="btn ghost" data-act="exportJSON">💾 Экспорт JSON</button>
    <button class="btn ghost" data-act="importJSON">📂 Импорт JSON</button>
    <button class="btn danger" data-act="clearAll">🗑 Удалить всё</button>
    <input type="file" id="importFile" accept="application/json" hidden>
  </div>`;
}

/* ================= РЕНДЕР И ЛОГИКА ================= */
function render(){
  document.getElementById('tab-diary').innerHTML = diaryHTML();
  document.getElementById('tab-stats').innerHTML = statsHTML();
  document.getElementById('tab-weight').innerHTML = weightHTML();
  document.getElementById('tab-settings').innerHTML = settingsHTML();

  document.querySelectorAll('.tab').forEach(s => s.classList.toggle('active', s.id === 'tab-' + tab));
  document.querySelectorAll('.tabbar button').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
}

function openSheet(mealKey){
  sheet = {meal: mealKey, food: null, grams: 100, custom: false};
  renderSheet();
  document.getElementById('sheetWrap').classList.add('open');
}
function closeSheet(){
  document.getElementById('sheetWrap').classList.remove('open');
  sheet = null;
}
function renderSheet(){
  const body = document.getElementById('sheetBody');
  const mealName = MEALS.find(m => m.key === sheet.meal).name;

  if (sheet.food){
    const f = sheet.food;
    const g = sheet.grams;
    body.innerHTML = `
      <div class="sheet-head"><b>${esc(f.n)}</b><button class="x" data-act="closeSheet">✕</button></div>
      <div class="field">
        <label>Порция (граммы)</label>
        <input class="input" type="number" id="gramsInput" value="${g}" oninput="onGrams(this.value)">
      </div>
      <div class="preview">
        <div class="prev-kcal" id="prevKcal">${Math.round(f.k*g/100)} ккал</div>
        <div class="muted small" id="prevMacro">Б ${(f.p*g/100).toFixed(1)} · Ж ${(f.f*g/100).toFixed(1)} · У ${(f.c*g/100).toFixed(1)}</div>
      </div>
      <div class="grid2">
        <button class="btn ghost" data-act="backToSearch">Назад</button>
        <button class="btn" data-act="addFood">Добавить</button>
      </div>`;
    return;
  }

  if (sheet.custom){
    body.innerHTML = `
      <div class="sheet-head"><b>Своё блюдо</b><button class="x" data-act="closeSheet">✕</button></div>
      <div class="field"><label>Название</label><input id="cName" class="input" placeholder="Например, борщ"></div>
      <div class="grid2">
        <div class="field"><label>Ккал</label><input id="cKcal" class="input" type="number"></div>
        <div class="field"><label>Белки</label><input id="cP" class="input" type="number"></div>
        <div class="field"><label>Жиры</label><input id="cF" class="input" type="number"></div>
        <div class="field"><label>Углеводы</label><input id="cC" class="input" type="number"></div>
      </div>
      <button class="btn" data-act="addCustom">Добавить</button>`;
    return;
  }

  body.innerHTML = `
    <div class="sheet-head"><b>В ${mealName}</b><button class="x" data-act="closeSheet">✕</button></div>
    <input id="foodSearch" class="input" placeholder="🔍 Поиск продукта..." oninput="renderFoodList()">
    <div id="foodList" class="food-list"></div>
    <button class="btn ghost" data-act="customMode">+ Своё блюдо</button>`;
  renderFoodList();
}
function renderFoodList(){
  const input = document.getElementById('foodSearch');
  const el = document.getElementById('foodList');
  if (!input || !el) return;
  const q = input.value.toLowerCase().trim();
  const list = FOODS.map((f, idx) => ({f, idx})).filter(x => x.f.n.toLowerCase().includes(q)).slice(0, 40);

  el.innerHTML = list.length
    ? list.map(({f, idx}) => `
      <button class="food-row" data-act="pickFood" data-idx="${idx}">
        <div><div>${esc(f.n)}</div><div class="muted small" style="font-size:11px; margin-top:2px;">Б ${f.p} · Ж ${f.f} · У ${f.c}</div></div>
        <div class="kcal">${f.k}</div>
      </button>`).join('')
    : `<div style="text-align:center; padding:20px; color:var(--text-muted);">Ничего не найдено</div>`;
}
function onGrams(v){
  if (!sheet || !sheet.food) return;
  sheet.grams = Math.max(1, Number(v) || 0);
  const f = sheet.food, g = sheet.grams;
  document.getElementById('prevKcal').textContent = Math.round(f.k*g/100) + ' ккал';
  document.getElementById('prevMacro').textContent = `Б ${(f.p*g/100).toFixed(1)} · Ж ${(f.f*g/100).toFixed(1)} · У ${(f.c*g/100).toFixed(1)}`;
}

function download(filename, content, type){
  const blob = new Blob(['\ufeff' + content], {type});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = filename; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}
function exportCSV(){
  const rows = [['Дата','Приём','Продукт','Граммы','Ккал','Белки','Жиры','Углеводы']];
  Object.keys(state.days).sort().forEach(date => {
    const d = state.days[date];
    if (!d.meals) return;
    MEALS.forEach(m => (d.meals[m.key] || []).forEach(i => {
      rows.push([date, m.name, i.name, i.grams || '', Math.round(i.kcal), i.p.toFixed(1), i.f.toFixed(1), i.c.toFixed(1)]);
    }));
  });
  const csv = rows.map(r => r.map(x => '"' + String(x).replace(/"/g,'""') + '"').join(';')).join('\n');
  download('food-diary.csv', csv, 'text/csv;charset=utf-8');
}
function exportJSON(){ download('mass-app-backup.json', JSON.stringify(state, null, 2), 'application/json'); }

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el) return;
  
  // Если кликнули по кнопке добавления или удаления, не раскрываем карточку
  if (el.dataset.act === 'toggleMeal') {
    // Проверяем, не кликнули ли мы на кнопку плюса внутри карточки
    if (e.target.closest('.add-btn') || e.target.closest('.btn-add-main')) {
      return; 
    }
    const card = el.closest('.meal-card');
    if (card) card.classList.toggle('expanded');
    return;
  }

  const act = el.dataset.act;

  switch(act){
    case 'tab': { tab = el.dataset.tab; render(); break; }
    case 'prevDay': { curDate = shiftDate(curDate, -1); render(); break; }
    case 'nextDay': { curDate = shiftDate(curDate, 1); render(); break; }
    case 'openAdd': { e.stopPropagation(); openSheet(el.dataset.meal); break; }
    case 'del': { e.stopPropagation(); delItem(el.dataset.meal, el.dataset.id); break; }
    case 'closeSheet': { closeSheet(); break; }
    case 'pickFood': {
      sheet.food = FOODS[Number(el.dataset.idx)];
      sheet.grams = 100;
      renderSheet();
      setTimeout(() => { const g = document.getElementById('gramsInput'); if (g) { g.focus(); g.select(); } }, 50);
      break;
    }
    case 'backToSearch': { sheet.food = null; renderSheet(); break; }
    case 'customMode': { sheet.custom = true; renderSheet(); break; }
    case 'addFood': {
      const f = sheet.food, g = sheet.grams;
      addItem(sheet.meal, { id: uid(), name: f.n, grams: g, kcal: f.k*g/100, p: f.p*g/100, f: f.f*g/100, c: f.c*g/100 });
      closeSheet(); break;
    }
    case 'addCustom': {
      const name = document.getElementById('cName').value.trim();
      const kcal = Number(document.getElementById('cKcal').value) || 0;
      if (!name || !kcal) { alert('Введите название и калорийность'); break; }
      addItem(sheet.meal, { id: uid(), name, grams: null, kcal, p: Number(document.getElementById('cP').value)||0, f: Number(document.getElementById('cF').value)||0, c: Number(document.getElementById('cC').value)||0 });
      closeSheet(); break;
    }
    case 'addWeight': {
      const date = document.getElementById('wDate').value;
      const val = Number(document.getElementById('wVal').value);
      if (!date || !val) { alert('Заполните данные'); break; }
      addWeight(date, val); break;
    }
    case 'delWeight': {
      state.weights = state.weights.filter(w => w.date !== el.dataset.date);
      saveState(); render(); break;
    }
    case 'autoCalc': {
      const p = state.profile, s = p.sex === 'm' ? 5 : -161;
      const bmr = 10*p.weight + 6.25*p.height - 5*p.age + s;
      const kcal = Math.round((bmr * p.activity + p.surplus) / 10) * 10;
      const protein = Math.round(p.weight * 2);
      const fat = Math.round(kcal * 0.25 / 9);
      const carbs = Math.max(0, Math.round((kcal - protein*4 - fat*9) / 4));
      state.goals = {kcal, p: protein, f: fat, c: carbs};
      saveState(); render(); alert('Норма рассчитана!'); break;
    }
    case 'saveGoals': {
      state.profile = { sex: document.getElementById('pSex').value, age: Number(document.getElementById('pAge').value)||29, height: Number(document.getElementById('pHeight').value)||155, weight: Number(document.getElementById('pWeight').value)||53, activity: Number(document.getElementById('pActivity').value)||1.375, surplus: Number(document.getElementById('pSurplus').value)||250 };
      state.goals = { kcal: Number(document.getElementById('gKcal').value)||2500, p: Number(document.getElementById('gP').value)||110, f: Number(document.getElementById('gF').value)||60, c: Number(document.getElementById('gC').value)||350 };
      saveState(); render(); alert('Сохранено ✓'); break;
    }
    case 'exportCSV': { exportCSV(); break; }
    case 'exportJSON': { exportJSON(); break; }
    case 'importJSON': { document.getElementById('importFile').click(); break; }
    case 'clearAll': {
      if(confirm('Удалить все данные?')) {
        localStorage.removeItem(STORE_KEY);
        state = loadState();
        curDate = iso(new Date());
        tab = 'diary';
        render();
      }
      break;
    }
  }
});

document.addEventListener('change', e => {
  if (e.target.id !== 'importFile') return;
  const reader = new FileReader();
  reader.onload = ev => {
    try {
      const data = JSON.parse(ev.target.result);
      state = Object.assign({goals:DEFAULT_GOALS, days:{}, weights:[], profile:{}}, data);
      saveState(); render(); alert('Импортировано ✓');
    } catch(err){ alert('Ошибка файла'); }
  };
  reader.readAsText(e.target.files[0]);
});

document.getElementById('sheetWrap').addEventListener('click', e => {
  if (e.target.id === 'sheetWrap') closeSheet();
});

render();
</script>
</body>
</html>
