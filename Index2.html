<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#10b981">
<title>Масса — трекер питания</title>
<style>
:root{
  --bg:#f4f6f8; --card:#ffffff; --text:#0f172a; --muted:#64748b;
  --accent:#10b981; --accent-soft:#d1fae5; --border:#e5e9ef;
  --protein:#ef4444; --fat:#f59e0b; --carb:#3b82f6; --danger:#ef4444;
  --radius:16px;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0b1220; --card:#151e2e; --text:#e8eef7; --muted:#8fa0b8;
    --border:#243146; --accent-soft:#0f3d31;
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
  background:var(--bg); color:var(--text); padding-bottom:88px;
  font-size:15px; line-height:1.4; -webkit-font-smoothing:antialiased;
}
.app{max-width:560px;margin:0 auto;padding:0 14px}
h3{font-size:15px;margin:0 0 12px;font-weight:700}
.muted{color:var(--muted)}
.small{font-size:12px}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:16px 2px 10px}
.logo{font-size:17px;font-weight:700;letter-spacing:-.3px}
.tab{display:none}
.tab.active{display:block;animation:fade .18s ease}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:14px;margin-bottom:12px}

/* --- summary --- */
.summary .big{font-size:34px;font-weight:800;letter-spacing:-1px;line-height:1.1}
.summary .unit{font-size:14px;font-weight:600;color:var(--muted);margin-left:4px}
.goal-chip{background:var(--accent-soft);color:var(--accent);font-size:12px;font-weight:700;padding:5px 10px;border-radius:99px}
.row-between{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:12px}
.bar{height:9px;background:var(--border);border-radius:99px;overflow:hidden;margin-top:10px}
.bar>i{display:block;height:100%;border-radius:99px;transition:width .35s ease;min-width:0}
.bar.sm{height:6px;margin-top:6px}
.macros{margin-top:14px;display:flex;flex-direction:column;gap:9px}
.macro-head{display:flex;justify-content:space-between;font-size:12.5px}
.macro-head b{font-weight:600}

/* --- date nav --- */
.datenav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}
.datenav button{
  width:42px;height:42px;border-radius:12px;border:1px solid var(--border);
  background:var(--card);color:var(--text);font-size:17px;cursor:pointer;flex:none;
}
.datenav .label{flex:1;text-align:center;font-weight:700;font-size:15px}
.datenav .label span{display:block;font-size:11px;font-weight:500;color:var(--muted);margin-top:1px}

/* --- meals --- */
.meal{padding:12px 14px}
.meal-head{display:flex;align-items:center;justify-content:space-between;gap:8px}
.meal-title{font-weight:700;font-size:14.5px}
.meal-right{display:flex;align-items:center;gap:10px}
.add-btn{
  width:34px;height:34px;border-radius:11px;border:0;background:var(--accent);color:#fff;
  font-size:20px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;
  transition:transform .12s;
}
.add-btn:active{transform:scale(.92)}
.item{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--border);margin-top:9px}
.item-main{flex:1;min-width:0}
.item-name{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item-meta{font-size:11.5px;color:var(--muted);margin-top:2px}
.del{
  width:30px;height:30px;border-radius:9px;border:0;background:transparent;color:var(--muted);
  font-size:15px;cursor:pointer;flex:none;
}
.del:active{background:var(--border)}
.empty{font-size:13px;color:var(--muted);padding:10px 0 2px}

/* --- chart --- */
.chart{display:flex;align-items:flex-end;gap:6px;height:150px;padding-top:6px}
.col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%}
.col-val{font-size:10px;color:var(--muted);margin-bottom:4px;height:12px}
.col-bar{width:100%;display:flex;align-items:flex-end;height:100%;background:var(--bg);border-radius:8px;overflow:hidden}
.col-bar>i{display:block;width:100%;border-radius:8px;transition:height .4s ease;background:var(--muted);opacity:.55}
.col-bar>i.hit{background:var(--accent);opacity:1}
.col-label{font-size:10.5px;color:var(--muted);margin-top:6px}
.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;text-align:center}
.stat-val{font-size:19px;font-weight:800;letter-spacing:-.5px}
.kv{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border);font-size:14px}
.kv:last-of-type{border-bottom:0}

/* --- buttons & inputs --- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  padding:12px 16px;border-radius:12px;border:0;background:var(--accent);color:#fff;
  font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;
}
.btn.ghost{background:transparent;border:1px solid var(--border);color:var(--text)}
.btn.danger{background:transparent;border:1px solid var(--danger);color:var(--danger)}
.btn.full{width:100%;margin-top:8px}
.btn:active{opacity:.85}
.input{
  width:100%;padding:11px 12px;border-radius:11px;border:1px solid var(--border);
  background:var(--bg);color:var(--text);font-size:15px;font-family:inherit;outline:none;
}
.input:focus{border-color:var(--accent)}
.field{margin-bottom:10px}
.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px;font-weight:600}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* --- sheet --- */
.sheet-wrap{position:fixed;inset:0;background:rgba(6,12,22,.55);display:none;z-index:100;align-items:flex-end;justify-content:center}
.sheet-wrap.open{display:flex;animation:fade .15s}
.sheet{
  background:var(--card);width:100%;max-width:560px;border-radius:22px 22px 0 0;
  max-height:88vh;overflow-y:auto;padding:16px 16px calc(20px + env(safe-area-inset-bottom));
  animation:up .22s ease;
}
@keyframes up{from{transform:translateY(30px)}to{transform:none}}
.sheet-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;font-size:16px}
.sheet-head .x{width:32px;height:32px;border-radius:10px;border:0;background:var(--bg);color:var(--muted);font-size:15px;cursor:pointer}
.food-list{max-height:46vh;overflow-y:auto;margin:6px 0}
.food-row{
  width:100%;display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:11px 4px;border:0;border-bottom:1px solid var(--border);background:transparent;
  color:var(--text);font-family:inherit;font-size:14px;text-align:left;cursor:pointer;
}
.food-row:active{background:var(--bg)}
.food-row .kcal{font-weight:700;white-space:nowrap;font-size:13.5px}
.preview{text-align:center;padding:18px 0;background:var(--bg);border-radius:14px;margin:6px 0 14px}
.prev-kcal{font-size:28px;font-weight:800;letter-spacing:-.8px;color:var(--accent)}
.sheet-actions{display:grid;grid-template-columns:1fr 2fr;gap:10px}

/* --- weight --- */
.wchart{width:100%;height:auto;display:block;margin-top:6px}
.wrow{display:flex;align-items:center;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--border);font-size:14px}
.wrow:last-child{border-bottom:0}

/* --- tabbar --- */
.tabbar{
  position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:560px;
  display:flex;background:var(--card);border-top:1px solid var(--border);z-index:50;
  padding:6px 0 calc(6px + env(safe-area-inset-bottom));border-radius:18px 18px 0 0;
  box-shadow:0 -4px 24px rgba(15,23,42,.06);
}
.tabbar button{
  flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;
  background:none;border:0;padding:6px 0;font-size:10.5px;font-weight:600;
  color:var(--muted);cursor:pointer;font-family:inherit;
}
.tabbar .ico{font-size:20px;line-height:1}
.tabbar button.active{color:var(--accent)}
</style>
</head>
<body>

<div class="app">
  <header class="topbar">
    <div class="logo">💪 Масса</div>
    <div class="small muted">трекер набора</div>
  </header>
  <main>
    <section class="tab active" id="tab-diary"></section>
    <section class="tab" id="tab-stats"></section>
    <section class="tab" id="tab-weight"></section>
    <section class="tab" id="tab-settings"></section>
  </main>
</div>

<nav class="tabbar">
  <button data-act="tab" data-tab="diary" class="active"><span class="ico">📔</span>Дневник</button>
  <button data-act="tab" data-tab="stats"><span class="ico">📊</span>Статистика</button>
  <button data-act="tab" data-tab="weight"><span class="ico">⚖️</span>Вес</button>
  <button data-act="tab" data-tab="settings"><span class="ico">⚙️</span>Настройки</button>
</nav>

<div class="sheet-wrap" id="sheetWrap"><div class="sheet" id="sheetBody"></div></div>

<script>
/* ================= ДАННЫЕ О ПРОДУКТАХ (на 100 г) ================= */
const FOODS = [
  {n:'Овсяные хлопья (сухие)', k:352, p:12.3, f:6.1, c:59.5},
  {n:'Гречка (сухая)', k:343, p:12.6, f:3.3, c:62},
  {n:'Рис белый (сухой)', k:344, p:6.7, f:0.7, c:78.9},
  {n:'Рис бурый (сухой)', k:337, p:7.4, f:1.8, c:72.9},
  {n:'Макароны (сухие)', k:350, p:12, f:1.5, c:70},
  {n:'Хлеб цельнозерновой', k:247, p:13, f:4.2, c:41},
  {n:'Картофель', k:77, p:2, f:0.4, c:17},
  {n:'Батат', k:86, p:1.6, f:0.1, c:20},
  {n:'Куриная грудка', k:165, p:31, f:3.6, c:0},
  {n:'Индейка, филе', k:104, p:19.2, f:2, c:0},
  {n:'Говядина', k:250, p:26, f:16, c:0},
  {n:'Свинина нежирная', k:263, p:27, f:16, c:0},
  {n:'Лосось', k:208, p:20, f:13, c:0},
  {n:'Тунец', k:130, p:23, f:4.9, c:0},
  {n:'Треска', k:82, p:18, f:0.7, c:0},
  {n:'Яйцо куриное', k:157, p:12.7, f:11.5, c:0.7},
  {n:'Творог 5%', k:121, p:17, f:5, c:3},
  {n:'Творог 0%', k:71, p:16.5, f:0.2, c:1.5},
  {n:'Греческий йогурт 2%', k:59, p:10, f:0.4, c:3.6},
  {n:'Кефир 1%', k:40, p:2.8, f:1, c:4},
  {n:'Молоко 2.5%', k:52, p:2.8, f:2.5, c:4.7},
  {n:'Сыр твёрдый', k:400, p:25, f:33, c:0},
  {n:'Банан', k:96, p:1.5, f:0.2, c:21},
  {n:'Яблоко', k:52, p:0.4, f:0.2, c:14},
  {n:'Апельсин', k:47, p:0.9, f:0.1, c:12},
  {n:'Виноград', k:69, p:0.7, f:0.2, c:17},
  {n:'Авокадо', k:160, p:2, f:15, c:9},
  {n:'Миндаль', k:579, p:21, f:50, c:22},
  {n:'Грецкий орех', k:654, p:15, f:65, c:14},
  {n:'Ореховая паста', k:588, p:25, f:50, c:20},
  {n:'Оливковое масло', k:884, p:0, f:100, c:0},
  {n:'Масло сливочное', k:717, p:0.9, f:81, c:0.1},
  {n:'Чечевица (сухая)', k:352, p:24, f:1, c:60},
  {n:'Фасоль (сухая)', k:333, p:24, f:1.5, c:60},
  {n:'Нут (сухой)', k:364, p:19, f:6, c:61},
  {n:'Изюм', k:299, p:3, f:0.5, c:79},
  {n:'Мёд', k:304, p:0.3, f:0, c:82},
  {n:'Шоколад тёмный 70%', k:598, p:7.8, f:43, c:46},
  {n:'Протеин (порошок)', k:380, p:75, f:5, c:8},
  {n:'Куриное бедро', k:185, p:20, f:11, c:0}
];

const MEALS = [
  {key:'breakfast', name:'Завтрак', icon:'🌅'},
  {key:'lunch',     name:'Обед',    icon:'🍲'},
  {key:'dinner',    name:'Ужин',    icon:'🌙'},
  {key:'snack',     name:'Перекус', icon:'🍎'}
];

const STORE_KEY = 'massApp_v1';
const DEFAULT_GOALS = {kcal:2500, p:110, f:60, c:350};

/* ================= СОСТОЯНИЕ ================= */
let state = loadState();
let curDate = iso(new Date());
let tab = 'diary';
let sheet = null;

function loadState(){
  let s = null;
  try { s = JSON.parse(localStorage.getItem(STORE_KEY)); } catch(e){}
  if (!s || typeof s !== 'object') s = {};
  s.goals = Object.assign({}, DEFAULT_GOALS, s.goals || {});
  s.days = s.days || {};
  s.weights = s.weights || [];
  s.profile = Object.assign(
    {sex:'m', age:29, height:155, weight:53, activity:1.375, surplus:250},
    s.profile || {}
  );
  return s;
}
function saveState(){ localStorage.setItem(STORE_KEY, JSON.stringify(state)); }

/* ================= ХЕЛПЕРЫ ================= */
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function iso(d){
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function parseISO(s){ const a = s.split('-').map(Number); return new Date(a[0], a[1]-1, a[2]); }
function shiftDate(s, delta){ const d = parseISO(s); d.setDate(d.getDate()+delta); return iso(d); }
const MONTHS = ['янв','фев','мар','апр','мая','июн','июл','авг','сен','окт','ноя','дек'];
const WEEKDAYS = ['вс','пн','вт','ср','чт','пт','сб'];

function humanDate(s){
  const d = parseISO(s), today = iso(new Date());
  const base = d.getDate()+' '+MONTHS[d.getMonth()];
  if (s === today) return {main:'Сегодня', sub:base};
  if (s === shiftDate(today,-1)) return {main:'Вчера', sub:base};
  if (s === shiftDate(today,1)) return {main:'Завтра', sub:base};
  return {main:WEEKDAYS[d.getDay()]+', '+d.getDate(), sub:MONTHS[d.getMonth()]};
}
function shortDay(s){ return WEEKDAYS[parseISO(s).getDay()]; }
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }

function getDayItems(date, mealKey){
  const d = state.days[date];
  return (d && d.meals && d.meals[mealKey]) || [];
}
function dayTotals(date){
  const t = {kcal:0, p:0, f:0, c:0};
  MEALS.forEach(m => getDayItems(date, m.key).forEach(i => {
    t.kcal += i.kcal; t.p += i.p; t.f += i.f; t.c += i.c;
  }));
  return t;
}
function lastNDates(n){
  const out = [], t = iso(new Date());
  for (let i = n-1; i >= 0; i--) out.push(shiftDate(t, -i));
  return out;
}

/* ================= ДЕЙСТВИЯ С ДАННЫМИ ================= */
function addItem(mealKey, item){
  if (!state.days[curDate]) state.days[curDate] = {meals:{}};
  const day = state.days[curDate];
  if (!day.meals) day.meals = {};
  if (!day.meals[mealKey]) day.meals[mealKey] = [];
  day.meals[mealKey].push(item);
  saveState(); render();
}
function delItem(mealKey, id){
  const day = state.days[curDate];
  if (!day || !day.meals || !day.meals[mealKey]) return;
  const arr = day.meals[mealKey];
  const i = arr.findIndex(x => x.id === id);
  if (i > -1){ arr.splice(i,1); saveState(); render(); }
}
function addWeight(date, weight){
  state.weights = state.weights.filter(w => w.date !== date);
  state.weights.push({date, weight});
  state.weights.sort((a,b) => a.date < b.date ? -1 : 1);
  state.profile.weight = weight;
  saveState(); render();
}

/* ================= РЕНДЕР: ДНЕВНИК ================= */
function diaryHTML(){
  const t = dayTotals(curDate), g = state.goals;
  const left = Math.round(g.kcal - t.kcal);
  const pct = v => Math.max(0, Math.min(100, (v / (g.kcal||1)) * 100));
  const hd = humanDate(curDate);

  const macros = [
    {n:'Белки',    v:t.p, goal:g.p, color:'var(--protein)'},
    {n:'Жиры',     v:t.f, goal:g.f, color:'var(--fat)'},
    {n:'Углеводы', v:t.c, goal:g.c, color:'var(--carb)'}
  ];

  return `
  <div class="datenav">
    <button data-act="prevDay">‹</button>
    <div class="label">${hd.main}<span>${hd.sub}</span></div>
    <button data-act="nextDay">›</button>
  </div>

  <div class="card summary">
    <div class="row-between">
      <div>
        <div class="big">${Math.round(t.kcal)}<span class="unit">ккал</span></div>
        <div class="muted small">${left >= 0 ? 'осталось ' + left : 'перебор ' + Math.abs(left)} ккал</div>
      </div>
      <div class="goal-chip">цель ${g.kcal}</div>
    </div>
    <div class="bar"><i style="width:${pct(t.kcal)}%;background:var(--accent)"></i></div>
    <div class="macros">
      ${macros.map(m => `
        <div>
          <div class="macro-head"><span>${m.n}</span><b>${Math.round(m.v)} / ${m.goal} г</b></div>
          <div class="bar sm"><i style="width:${Math.max(0,Math.min(100,(m.v/(m.goal||1))*100))}%;background:${m.color}"></i></div>
        </div>`).join('')}
    </div>
  </div>

  ${MEALS.map(m => {
    const items = getDayItems(curDate, m.key);
    const sum = items.reduce((a,i) => a + i.kcal, 0);
    return `
    <div class="card meal">
      <div class="meal-head">
        <div class="meal-title">${m.icon} ${m.name}</div>
        <div class="meal-right">
          <span class="muted small">${Math.round(sum)} ккал</span>
          <button class="add-btn" data-act="openAdd" data-meal="${m.key}">+</button>
        </div>
      </div>
      ${items.length ? items.map(i => `
        <div class="item">
          <div class="item-main">
            <div class="item-name">${esc(i.name)}</div>
            <div class="item-meta">${i.grams ? i.grams + ' г · ' : ''}${Math.round(i.kcal)} ккал · Б${Math.round(i.p)} Ж${Math.round(i.f)} У${Math.round(i.c)}</div>
          </div>
          <button class="del" data-act="del" data-meal="${m.key}" data-id="${i.id}">✕</button>
        </div>`).join('') : `<div class="empty">Пусто — нажмите «+»</div>`}
    </div>`;
  }).join('')}`;
}

/* ================= РЕНДЕР: СТАТИСТИКА ================= */
function statsHTML(){
  const dates = lastNDates(7);
  const vals = dates.map(d => dayTotals(d));
  const g = state.goals;
  const maxV = Math.max(g.kcal, ...vals.map(v => v.kcal), 1);
  const active = vals.filter(v => v.kcal > 0);

  const avg = key => active.length ? Math.round(active.reduce((a,v) => a + v[key], 0) / active.length) : 0;
  const totalWeek = Math.round(vals.reduce((a,v) => a + v.kcal, 0));
  const onTarget = vals.filter(v => v.kcal >= g.kcal * 0.95).length;

  return `
  <div class="card">
    <h3>Последние 7 дней</h3>
    <div class="chart">
      ${dates.map((d,i) => {
        const v = vals[i];
        const h = Math.round((v.kcal / maxV) * 100);
        const hit = v.kcal >= g.kcal * 0.95;
        return `<div class="col">
          <div class="col-val">${v.kcal ? Math.round(v.kcal) : ''}</div>
          <div class="col-bar"><i class="${hit?'hit':''}" style="height:${h}%"></i></div>
          <div class="col-label">${shortDay(d)}</div>
        </div>`;
      }).join('')}
    </div>
    <div class="muted small" style="margin-top:10px;text-align:center">Цель: ${g.kcal} ккал/день · зелёные столбцы — дни у цели</div>
  </div>

  <div class="card">
    <h3>Средние за 7 дней</h3>
    <div class="stat-grid">
      <div><div class="stat-val">${avg('kcal')}</div><div class="muted small">ккал</div></div>
      <div><div class="stat-val" style="color:var(--protein)">${avg('p')}</div><div class="muted small">белки</div></div>
      <div><div class="stat-val" style="color:var(--fat)">${avg('f')}</div><div class="muted small">жиры</div></div>
      <div><div class="stat-val" style="color:var(--carb)">${avg('c')}</div><div class="muted small">углев.</div></div>
    </div>
  </div>

  <div class="card">
    <h3>Отчёт</h3>
    <div class="kv"><span>Дней с записями</span><b>${active.length} / 7</b></div>
    <div class="kv"><span>Дней у цели</span><b>${onTarget}</b></div>
    <div class="kv"><span>Сумма за неделю</span><b>${totalWeek} ккал</b></div>
    <div class="kv"><span>Средний дефицит/профицит</span><b>${active.length ? (avg('kcal') - g.kcal > 0 ? '+' : '') + (avg('kcal') - g.kcal) + ' ккал' : '—'}</b></div>
    <button class="btn ghost full" data-act="exportCSV">📥 Скачать CSV за всё время</button>
  </div>`;
}

/* ================= РЕНДЕР: ВЕС ================= */
function weightHTML(){
  const ws = state.weights.slice().sort((a,b) => a.date < b.date ? -1 : 1);
  const last = ws[ws.length-1];
  const prev = ws[ws.length-2];
  const diff = last && prev ? (last.weight - prev.weight) : 0;
  const first = ws[0];
  const totalDiff = last && first && ws.length > 1 ? (last.weight - first.weight) : 0;

  let chart = `<div class="empty">Добавьте минимум 2 взвешивания, чтобы увидеть график</div>`;
  if (ws.length >= 2){
    const data = ws.slice(-30);
    const W = 320, H = 130, PAD = 12;
    const vs = data.map(x => x.weight);
    const min = Math.min(...vs) - 0.7, max = Math.max(...vs) + 0.7;
    const pts = data.map((x,i) => {
      const px = PAD + (i / (data.length - 1)) * (W - 2*PAD);
      const py = H - PAD - ((x.weight - min) / (max - min || 1)) * (H - 2*PAD);
      return {x:px, y:py, w:x.weight};
    });
    chart = `<svg viewBox="0 0 ${W} ${H}" class="wchart">
      <polyline points="${pts.map(p => p.x.toFixed(1)+','+p.y.toFixed(1)).join(' ')}"
        fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
      ${pts.map(p => `<circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="3" fill="var(--card)" stroke="var(--accent)" stroke-width="2"/>`).join('')}
    </svg>`;
  }

  return `
  <div class="card">
    <div class="row-between">
      <div>
        <div class="big">${last ? last.weight.toFixed(1) : '—'}<span class="unit">кг</span></div>
        <div class="muted small">${last ? 'последнее взвешивание: ' + parseISO(last.date).getDate() + ' ' + MONTHS[parseISO(last.date).getMonth()] : 'нет данных'}</div>
      </div>
      ${ws.length > 1 ? `<div class="goal-chip" style="${totalDiff < 0 ? 'color:var(--danger);background:transparent;border:1px solid var(--danger)' : ''}">
        ${totalDiff > 0 ? '+' : ''}${totalDiff.toFixed(1)} кг всего
      </div>` : ''}
    </div>
    ${chart}
  </div>

  <div class="card">
    <h3>Добавить взвешивание</h3>
    <div class="grid2">
      <div class="field">
        <label>Дата</label>
        <input type="date" id="wDate" class="input" value="${iso(new Date())}">
      </div>
      <div class="field">
        <label>Вес, кг</label>
        <input type="number" step="0.1" id="wVal" class="input" placeholder="53.0">
      </div>
    </div>
    <button class="btn full" data-act="addWeight">Сохранить</button>
  </div>

  ${ws.length ? `
  <div class="card">
    <h3>История</h3>
    ${ws.slice().reverse().slice(0,20).map(w => `
      <div class="wrow">
        <span>${parseISO(w.date).getDate()} ${MONTHS[parseISO(w.date).getMonth()]} ${parseISO(w.date).getFullYear()}</span>
        <b>${w.weight.toFixed(1)} кг</b>
        <button class="del" data-act="delWeight" data-date="${w.date}">✕</button>
      </div>`).join('')}
  </div>` : ''}`;
}

/* ================= РЕНДЕР: НАСТРОЙКИ ================= */
function settingsHTML(){
  const p = state.profile, g = state.goals;
  const acts = [[1.2,'Сидячая (1.2)'],[1.375,'Лёгкая (1.375)'],[1.55,'Средняя (1.55)'],[1.725,'Высокая (1.725)']];

  return `
  <div class="card">
    <h3>Профиль</h3>
    <div class="grid2">
      <div class="field"><label>Пол</label>
        <select id="pSex" class="input">
          <option value="m" ${p.sex==='m'?'selected':''}>Мужской</option>
          <option value="f" ${p.sex==='f'?'selected':''}>Женский</option>
        </select>
      </div>
      <div class="field"><label>Возраст</label><input id="pAge" class="input" type="number" value="${p.age}"></div>
      <div class="field"><label>Рост, см</label><input id="pHeight" class="input" type="number" value="${p.height}"></div>
      <div class="field"><label>Вес, кг</label><input id="pWeight" class="input" type="number" step="0.1" value="${p.weight}"></div>
    </div>
    <div class="field"><label>Повседневная активность</label>
      <select id="pActivity" class="input">
        ${acts.map(([v,n]) => `<option value="${v}" ${Math.abs(p.activity-v)<0.001?'selected':''}>${n}</option>`).join('')}
      </select>
    </div>
    <div class="field"><label>Профицит калорий, ккал</label><input id="pSurplus" class="input" type="number" value="${p.surplus}"></div>
    <button class="btn full" data-act="autoCalc">🧮 Рассчитать норму автоматически</button>
  </div>

  <div class="card">
    <h3>Цели на день</h3>
    <div class="grid2">
      <div class="field"><label>Калории</label><input id="gKcal" class="input" type="number" value="${g.kcal}"></div>
      <div class="field"><label>Белки, г</label><input id="gP" class="input" type="number" value="${g.p}"></div>
      <div class="field"><label>Жиры, г</label><input id="gF" class="input" type="number" value="${g.f}"></div>
      <div class="field"><label>Углеводы, г</label><input id="gC" class="input" type="number" value="${g.c}"></div>
    </div>
    <button class="btn full" data-act="saveGoals">Сохранить цели</button>
  </div>

  <div class="card">
    <h3>Данные</h3>
    <button class="btn ghost full" data-act="exportJSON">💾 Экспорт JSON (резервная копия)</button>
    <button class="btn ghost full" data-act="importJSON">📂 Импорт JSON</button>
    <button class="btn danger full" data-act="clearAll">🗑 Удалить все данные</button>
    <input type="file" id="importFile" accept="application/json" hidden>
    <div class="muted small" style="margin-top:10px;text-align:center">Данные хранятся только в этом браузере</div>
  </div>`;
}

/* ================= ОБЩИЙ РЕНДЕР ================= */
function render(){
  document.getElementById('tab-diary').innerHTML = diaryHTML();
  document.getElementById('tab-stats').innerHTML = statsHTML();
  document.getElementById('tab-weight').innerHTML = weightHTML();
  document.getElementById('tab-settings').innerHTML = settingsHTML();

  document.querySelectorAll('.tab').forEach(s => s.classList.toggle('active', s.id === 'tab-' + tab));
  document.querySelectorAll('.tabbar button').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
  window.scrollTo({top:0, behavior:'instant'});
}

/* ================= МОДАЛКА ДОБАВЛЕНИЯ ================= */
function openSheet(mealKey){
  sheet = {meal: mealKey, food: null, grams: 100, custom: false};
  renderSheet();
  document.getElementById('sheetWrap').classList.add('open');
}
function closeSheet(){
  document.getElementById('sheetWrap').classList.remove('open');
  sheet = null;
}
function renderSheet(){
  const body = document.getElementById('sheetBody');
  const mealName = MEALS.find(m => m.key === sheet.meal).name;

  if (sheet.food){
    const f = sheet.food;
    const g = sheet.grams;
    body.innerHTML = `
      <div class="sheet-head"><b>${esc(f.n)}</b><button class="x" data-act="closeSheet">✕</button></div>
      <div class="field">
        <label>Порция, граммы</label>
        <input class="input" type="number" id="gramsInput" value="${g}" oninput="onGrams(this.value)">
      </div>
      <div class="preview">
        <div class="prev-kcal" id="prevKcal">${Math.round(f.k*g/100)} ккал</div>
        <div class="muted small" id="prevMacro">Б ${(f.p*g/100).toFixed(1)} · Ж ${(f.f*g/100).toFixed(1)} · У ${(f.c*g/100).toFixed(1)}</div>
        <div class="muted small" style="margin-top:4px">на 100 г: ${f.k} ккал</div>
      </div>
      <div class="sheet-actions">
        <button class="btn ghost" data-act="backToSearch">Назад</button>
        <button class="btn" data-act="addFood">Добавить в «${mealName}»</button>
      </div>`;
    return;
  }

  if (sheet.custom){
    body.innerHTML = `
      <div class="sheet-head"><b>Своё блюдо</b><button class="x" data-act="closeSheet">✕</button></div>
      <div class="field"><label>Название</label><input id="cName" class="input" placeholder="Например, домашний борщ"></div>
      <div class="grid2">
        <div class="field"><label>Калории</label><input id="cKcal" class="input" type="number" placeholder="0"></div>
        <div class="field"><label>Белки, г</label><input id="cP" class="input" type="number" placeholder="0"></div>
        <div class="field"><label>Жиры, г</label><input id="cF" class="input" type="number" placeholder="0"></div>
        <div class="field"><label>Углеводы, г</label><input id="cC" class="input" type="number" placeholder="0"></div>
      </div>
      <button class="btn full" data-act="addCustom">Добавить в «${mealName}»</button>`;
    return;
  }

  body.innerHTML = `
    <div class="sheet-head"><b>Добавить в «${mealName}»</b><button class="x" data-act="closeSheet">✕</button></div>
    <input id="foodSearch" class="input" placeholder="🔍 Поиск продукта..." oninput="renderFoodList()">
    <div id="foodList" class="food-list"></div>
    <button class="btn ghost full" data-act="customMode">+ Своё блюдо (ручной ввод)</button>`;
  renderFoodList();
}
function renderFoodList(){
  const input = document.getElementById('foodSearch');
  const el = document.getElementById('foodList');
  if (!input || !el) return;
  const q = input.value.toLowerCase().trim();
  const list = FOODS
    .map((f, idx) => ({f, idx}))
    .filter(x => x.f.n.toLowerCase().includes(q))
    .slice(0, 40);

  el.innerHTML = list.length
    ? list.map(({f, idx}) => `
      <button class="food-row" data-act="pickFood" data-idx="${idx}">
        <div>
          <div>${esc(f.n)}</div>
          <div class="muted small">Б ${f.p} · Ж ${f.f} · У ${f.c}</div>
        </div>
        <div class="kcal">${f.k} <span class="muted small">ккал</span></div>
      </button>`).join('')
    : `<div class="empty">Ничего не найдено. Добавьте блюдо вручную.</div>`;
}
function onGrams(v){
  if (!sheet || !sheet.food) return;
  sheet.grams = Math.max(1, Number(v) || 0);
  const f = sheet.food, g = sheet.grams;
  const k = f.k*g/100, p = f.p*g/100, fa = f.f*g/100, c = f.c*g/100;
  const ek = document.getElementById('prevKcal');
  const em = document.getElementById('prevMacro');
  if (ek) ek.textContent = Math.round(k) + ' ккал';
  if (em) em.textContent = `Б ${p.toFixed(1)} · Ж ${fa.toFixed(1)} · У ${c.toFixed(1)}`;
}

/* ================= ЭКСПОРТ / ИМПОРТ ================= */
function download(filename, content, type){
  const blob = new Blob(['\ufeff' + content], {type});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}
function exportCSV(){
  const rows = [['Дата','Приём','Продукт','Граммы','Ккал','Белки','Жиры','Углеводы']];
  Object.keys(state.days).sort().forEach(date => {
    const d = state.days[date];
    if (!d.meals) return;
    MEALS.forEach(m => (d.meals[m.key] || []).forEach(i => {
      rows.push([date, m.name, i.name, i.grams || '', Math.round(i.kcal), i.p.toFixed(1), i.f.toFixed(1), i.c.toFixed(1)]);
    }));
  });
  const csv = rows.map(r => r.map(x => '"' + String(x).replace(/"/g,'""') + '"').join(';')).join('\n');
  download('mass-food-diary.csv', csv, 'text/csv;charset=utf-8');
}
function exportJSON(){
  download('mass-app-backup.json', JSON.stringify(state, null, 2), 'application/json');
}

/* ================= ОБРАБОТКА КЛИКОВ ================= */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const act = el.dataset.act;

  switch(act){
    case 'tab':
      tab = el.dataset.tab; render(); break;

    case 'prevDay':
      curDate = shiftDate(curDate, -1); render(); break;

    case 'nextDay':
      curDate = shiftDate(curDate, 1); render(); break;

    case 'openAdd':
      openSheet(el.dataset.meal); break;

    case 'del':
      delItem(el.dataset.meal, el.dataset.id); break;

    case 'closeSheet':
      closeSheet(); break;

    case 'pickFood':
      sheet.food = FOODS[Number(el.dataset.idx)];
      sheet.grams = 100;
      renderSheet();
      setTimeout(() => { const g = document.getElementById('gramsInput'); if (g) { g.focus(); g.select(); } }, 50);
      break;

    case 'backToSearch':
      sheet.food = null; renderSheet(); break;

    case 'customMode':
      sheet.custom = true; renderSheet(); break;

    case 'addFood': {
      const f = sheet.food, g = sheet.grams;
      addItem(sheet.meal, {
        id: uid(), name: f.n, grams: g,
        kcal: f.k*g/100, p: f.p*g/100, f: f.f*g/100, c: f.c*g/100
      });
      closeSheet();
      break;
    }

    case 'addCustom': {
      const name = document.getElementById('cName').value.trim();
      const kcal = Number(document.getElementById('cKcal').value) || 0;
      if (!name || !kcal) { alert('Введите название и калорийность'); return; }
      addItem(sheet.meal, {
        id: uid(), name, grams: null,
        kcal,
        p: Number(document.getElementById('cP').value) || 0,
        f: Number(document.getElementById('cF').value) || 0,
        c: Number(document.getElementById('cC').value) || 0
      });
      closeSheet();
      break;
    }

    case 'addWeight': {
      const date = document.getElementById('wDate').value;
      const val = Number(document.getElementById('wVal').value);
      if (!date || !val || val < 20 || val > 300) { alert('Введите корректный вес'); return; }
      addWeight(date, val);
      break;
    }

    case 'delWeight': {
      state.weights = state.weights.filter(w => w.date !== el.dataset.date);
      saveState(); render(); break;
    }

    case 'autoCalc': {
      const p = state.profile;
      const s = p.sex === 'm' ? 5 : -161;
      const bmr = 10*p.weight + 6.25*p.height - 5*p.age + s;
      const tdee = bmr * p.activity;
      const kcal = Math.round((tdee + p.surplus) / 10) * 10;
      const protein = Math.round(p.weight * 2);
      const fat = Math.round(kcal * 0.25 / 9);
      const carbs = Math.max(0, Math.round((kcal - protein*4 - fat*9) / 4));
      state.goals = {kcal, p: protein, f: fat, c: carbs};
      saveState(); render();
      alert(`Норма рассчитана:\n${kcal} ккал\nБелки ${protein} г · Жиры ${fat} г · Углеводы ${carbs} г`);
      break;
    }

    case 'saveGoals': {
      state.profile = {
        sex: document.getElementById('pSex').value,
        age: Number(document.getElementById('pAge').value) || 29,
        height: Number(document.getElementById('pHeight').value) || 155,
        weight: Number(document.getElementById('pWeight').value) || 53,
        activity: Number(document.getElementById('pActivity').value) || 1.375,
        surplus: Number(document.getElementById('pSurplus').value) || 250
      };
      state.goals = {
        kcal: Number(document.getElementById('gKcal').value) || 2500,
        p: Number(document.getElementById('gP').value) || 110,
        f: Number(document.getElementById('gF').value) || 60,
        c: Number(document.getElementById('gC').value) || 350
      };
      saveState(); render();
      alert('Сохранено ✓');
      break;
    }

    case 'exportCSV': exportCSV(); break;
    case 'exportJSON': exportJSON(); break;

    case 'importJSON':
      document.getElementById('importFile').click();
      break;

    case 'clearAll':
      if (confirm('Удалить все данные без возможности восстановления?')){
        localStorage.removeItem(STORE_KEY);
        state = loadState(); curDate = iso(new Date()); tab = 'diary'; render();
      }
      break;
  }
});

/* импорт файла */
document.addEventListener('change', e => {
  if (e.target.id !== 'importFile') return;
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    try {
      const data = JSON.parse(ev.target.result);
      if (!data || typeof data !== 'object') throw new Error();
      state = Object.assign({goals:DEFAULT_GOALS, days:{}, weights:[], profile:{}}, data);
      saveState(); render();
      alert('Данные импортированы ✓');
    } catch(err){
      alert('Не удалось прочитать файл');
    }
  };
  reader.readAsText(file);
});

/* клик по затемнению закрывает модалку */
document.getElementById('sheetWrap').addEventListener('click', e => {
  if (e.target.id === 'sheetWrap') closeSheet();
});

/* ================= СТАРТ ================= */
render();
</script>
</body>
</html>
